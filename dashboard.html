<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>速88貸｜案件管理後台</title>
  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body>
  <main class="dashboard-shell">
    <header class="dash-header">
      <div class="dash-brand"><span class="dash-mark">88</span><div><h1>案件管理後台</h1><p>速88貸智慧後台 V1</p></div></div>
      <nav class="dash-tabs">
        <button class="tab-button active" data-filter="all">全部案件</button>
        <button class="tab-button" data-filter="review">待審核</button>
        <button class="tab-button" data-filter="supplement">需補件</button>
        <button class="tab-button" data-filter="video">待視訊</button>
        <button class="tab-button" data-filter="pay">待撥款</button>
      </nav>
    </header>

    <section class="summary-grid">
      <article class="summary-card" data-key="today">
        <span>今日申請</span>
        <strong id="countToday">0</strong>
      </article>
      <article class="summary-card" data-key="review">
        <span>待審核</span>
        <strong id="countReview">0</strong>
      </article>
      <article class="summary-card" data-key="supplement">
        <span>需補件</span>
        <strong id="countSupplement">0</strong>
      </article>
      <article class="summary-card" data-key="video">
        <span>待視訊</span>
        <strong id="countVideo">0</strong>
      </article>
      <article class="summary-card" data-key="pay">
        <span>待撥款</span>
        <strong id="countPay">0</strong>
      </article>
    </section>

    <section class="table-panel">
      <div class="table-header">
        <div>
          <h2>案件列表</h2>
          <p>查看最新申請與審核進度。</p>
        </div>
        <div class="search-area">
          <input id="searchInput" type="search" placeholder="搜尋案件編號、姓名、手機" />
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>案件編號</th>
              <th>姓名</th>
              <th>手機</th>
              <th>步驟</th>
              <th>狀態</th>
              <th>時間</th>
            </tr>
          </thead>
          <tbody id="caseList"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="js/dashboard.js"></script>
</body>
</html>
